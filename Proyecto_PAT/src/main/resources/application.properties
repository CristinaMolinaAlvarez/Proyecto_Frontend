spring.application.name=Proyecto_PAT

# ── Base de datos H2 en memoria ───────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:padeldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea/actualiza las tablas automáticamente a partir de las entidades
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Consola H2 (útil en desarrollo)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.edu.comillas.icai.gitt.pat.spring.Proyecto_PAT=DEBUG
